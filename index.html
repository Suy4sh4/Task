<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0f1112" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tasks" />
    <meta name="description" content="A simple place for what needs doing." />
    <title>Tasks</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>document.documentElement.classList.add("js");</script>
    <link rel="stylesheet" href="styles.css?v=6" />
  </head>
  <body>
    <main class="space">
      <div class="bar">
        <span class="bar-count" id="count"></span>
        <button class="bar-btn" id="groupToggle" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
          <span>Group</span>
        </button>
      </div>

      <div class="composer-wrap" id="composerWrap">
        <form class="composer" id="composer" autocomplete="off">
          <span class="mark" aria-hidden="true">+</span>
          <input
            id="taskInput"
            class="input"
            type="text"
            name="task"
            placeholder="Add a task…   #group"
            maxlength="140"
            aria-label="New task"
            autocomplete="off"
            spellcheck="false"
            autocapitalize="sentences"
            enterkeyhint="done"
          />
          <button class="add-btn" id="addBtn" type="submit" aria-label="Add task">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                d="M12 19V5M6 11l6-6 6 6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </form>
      </div>

      <div id="taskList" class="list" aria-live="off"></div>
      <p id="emptyState" class="empty" hidden>Nothing here yet.</p>
    </main>

    <!-- Task options -->
    <div class="sheet-backdrop" id="sheetBackdrop" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="grabber" aria-hidden="true"></div>
        <div class="sheet-head">
          <span class="sheet-title" id="sheetTitle">Task options</span>
        </div>

        <label class="field-label" for="sheetText">Task</label>
        <input
          class="sheet-text-input"
          id="sheetText"
          type="text"
          maxlength="140"
          aria-label="Edit task text"
          autocapitalize="sentences"
        />

        <div class="field-label">Priority</div>
        <div class="segmented" id="priorityOptions">
          <button type="button" data-value="high">High</button>
          <button type="button" data-value="mid">Mid</button>
          <button type="button" data-value="low">Low</button>
          <button type="button" data-value="">None</button>
        </div>

        <div class="field-label">Group</div>
        <input
          class="group-input"
          id="groupInput"
          type="text"
          placeholder="e.g. College, Personal…"
          maxlength="32"
          aria-label="Group name"
          autocapitalize="words"
        />
        <div class="chips" id="groupChips"></div>

        <div class="sheet-actions">
          <button class="sheet-delete" type="button" id="deleteTask">Delete</button>
          <button class="sheet-done" type="button" id="sheetDone">Done</button>
        </div>
      </div>
    </div>

    <div id="announcer" role="status" aria-live="polite" class="sr-only"></div>

    <script src="config.js?v=6"></script>
    <script src="app.js?v=6"></script>
  </body>
</html>
